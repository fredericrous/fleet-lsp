schema_version = 1

# Profiles the router selects among. Explicit model IDs keep policies
# reproducible; the effective model is recorded on every dispatch.
[models.research]
id = "haiku"

[models.implementation]
id = "sonnet"
effort = "medium"

[models.escalation]
id = "opus"
effort = "medium"

[execution]
max_attempts = 3
max_repairs_before_escalation = 1
max_wall_seconds = 1200
allow_nested_agents = true
max_agent_depth = 3
max_agents_total = 24

# How much context one worker prompt may carry: objective, acceptance
# criteria, architectural constraints and entry points together. A task
# whose package does not fit is a sizing problem — split it — and never a
# silently truncated prompt (SPEC §7). This is executable authority: it
# is hashed into the trust grant, so raising it is reviewed.
# [context]
# budget_bytes = 65536

# Proposed by `relais init --detect` from this repository's files.
# Nothing here runs until a person grants trust for it.
# required blocks execution when missing; optional gaps are reported.
[integrations]
aval = "required"
amont = "optional"
amont_agent = "optional"

# `make check`'s gates, one check each, without `make msrv`: CI's msrv job
# proves the declared floor on every pull request, and a whole second build
# on the floor toolchain per candidate and per uncached base was the
# laptop's heaviest repeat (relais#363 did the same for relais; decisions
# docs/plans/2026-11-01-one-verdict-build.md, phase P1).
[[verification.profiles.default.setup]]
argv = ["make", "toolchain"]
timeout_seconds = 300

[[verification.profiles.default.commands]]
argv = ["make", "deps"]
timeout_seconds = 300

# One profile command per gate (relais ADR-0013, `acceptance.adapters`): each
# gate runs through `amont run --stamp <gate>`, so amont records its verdict
# on the candidate's tree, and the person's commit and push of that tree skip
# it instead of running it again. `GREENGATE_ON_BUSY=wait`: relais already holds
# the host slot. The parts of `make check` that are not gates stay plain.
[[verification.profiles.default.commands]]
argv = ["amont", "run", "--stamp", "cargo-fmt"]
timeout_seconds = 300
env = { GREENGATE_ON_BUSY = "wait" }

[[verification.profiles.default.commands]]
argv = ["amont", "run", "--stamp", "clippy"]
timeout_seconds = 600
env = { GREENGATE_ON_BUSY = "wait" }

[[verification.profiles.default.commands]]
argv = ["amont", "run", "--stamp", "cargo-test"]
timeout_seconds = 600
env = { GREENGATE_ON_BUSY = "wait" }

# Cache an all-green base by tree, profile and toolchain (SPEC §18): every
# command here is local and deterministic (no fetch, no install, no clock),
# and a red base is never cached (decisions
# docs/plans/2026-11-01-one-verdict-build.md, phase P1).
[verification.profiles.default]
cache_baseline = true
